version: '3.8'

services:
  impactsync-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impactsync-ai
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - impactsync-network

networks:
  impactsync-network:
    driver: bridge

